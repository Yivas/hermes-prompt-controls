name: Feature request
description: Propose a scoped public prompt-control contract or compatibility improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What public Hermes Agent integration problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest observable change using fictional examples.
    validations:
      required: true
  - type: textarea
    id: host_support
    attributes:
      label: Public host support
      description: Link the Hermes Agent version, commit, API and request mode that support the proposal.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, cache and failure behavior
      description: Explain effects on prompt data, identifiers, cache identity and fail-open behavior.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched open and closed issues.
          required: true
        - label: I used fictional examples and removed operational data.
          required: true
        - label: The proposal does not require private host imports or monkeypatches.
          required: true
